<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>時間割・カレンダー</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- ==================================================
         ヘッダー
    ================================================== -->

    <header class="app-header">

        <div class="header-title">

            <h1>
                時間割
            </h1>

        </div>


        <div class="schedule-controls">

            <select
                id="scheduleSelect"
                aria-label="時間割を選択"
            ></select>


            <button
                id="addScheduleButton"
                type="button"
            >
                ＋
            </button>


            <button
                id="renameScheduleButton"
                type="button"
            >
                名前変更
            </button>


            <button
                id="deleteScheduleButton"
                type="button"
            >
                削除
            </button>

        </div>

    </header>


    <!-- ==================================================
         メイン
    ================================================== -->

    <main class="main-container">


        <!-- ==================================================
             時間割
        ================================================== -->

        <section
            class="timetable-section"
            id="timetableSection"
        >

            <div class="section-header">

                <div>

                    <h2 id="scheduleTitle">
                        時間割
                    </h2>

                    <div class="credit-display">

                        合計
                        <span id="totalCredit">
                            0
                        </span>
                        単位

                    </div>

                </div>


                <button
                    id="addClassButton"
                    class="primary-button"
                    type="button"
                >
                    ＋ 授業を追加
                </button>

            </div>


            <!-- ==================================================
                 時間割表
            ================================================== -->

            <div class="timetable-wrapper">

                <table
                    class="timetable"
                >

                    <thead>

                        <tr>

                            <th>
                                時限
                            </th>

                            <th>
                                月
                            </th>

                            <th>
                                火
                            </th>

                            <th>
                                水
                            </th>

                            <th>
                                木
                            </th>

                            <th>
                                金
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="timetableBody"
                    >

                    </tbody>

                </table>

            </div>

        </section>



        <!-- ==================================================
             カレンダー
        ================================================== -->

        <section
            class="calendar-section"
            id="calendarSection"
        >

            <div class="section-header">

                <div>

                    <h2>
                        カレンダー
                    </h2>

                </div>


                <button
                    id="addEventButton"
                    class="primary-button"
                    type="button"
                >
                    ＋ 予定を追加
                </button>

            </div>


            <!-- ==================================================
                 カレンダーナビゲーション
            ================================================== -->

            <div class="calendar-navigation">

                <button
                    id="previousMonthButton"
                    type="button"
                    aria-label="前月"
                >
                    ‹
                </button>


                <h3
                    id="calendarTitle"
                >
                    2026年8月
                </h3>


                <button
                    id="nextMonthButton"
                    type="button"
                    aria-label="次月"
                >
                    ›
                </button>

            </div>


            <div class="calendar-tools">

                <button
                    id="todayButton"
                    type="button"
                >
                    今日
                </button>

            </div>


            <!-- ==================================================
                 カレンダー
            ================================================== -->

            <div
                id="calendar"
                class="calendar"
            >

            </div>


            <!-- ==================================================
                 選択日の予定
            ================================================== -->

            <div class="selected-date-events">

                <div class="selected-date-header">

                    <h3
                        id="selectedDateTitle"
                    >
                        予定
                    </h3>

                </div>


                <div
                    id="eventList"
                    class="event-list"
                >

                </div>

            </div>

        </section>

    </main>



    <!-- ==================================================
         授業追加・編集モーダル
    ================================================== -->

    <div
        id="classModal"
        class="modal"
    >

        <div class="modal-content">


            <!-- ヘッダー -->

            <div class="modal-header">

                <h2
                    id="classModalTitle"
                >
                    授業を追加
                </h2>


                <button
                    id="closeClassModalButton"
                    class="close-button"
                    type="button"
                    aria-label="閉じる"
                >
                    ×
                </button>

            </div>


            <!-- ==================================================
                 授業名
            ================================================== -->

            <div class="form-group">

                <label
                    for="className"
                >
                    授業名
                </label>


                <input
                    id="className"
                    type="text"
                    placeholder="例：統計学"
                    autocomplete="off"
                >

            </div>


            <!-- ==================================================
                 教員
            ================================================== -->

            <div class="form-group">

                <label
                    for="teacher"
                >
                    教員
                </label>


                <input
                    id="teacher"
                    type="text"
                    placeholder="例：山田先生"
                    autocomplete="off"
                >

            </div>


            <!-- ==================================================
                 単位
            ================================================== -->

            <div class="form-group">

                <label
                    for="credit"
                >
                    単位数
                </label>


                <input
                    id="credit"
                    type="number"
                    min="0"
                    step="0.5"
                    value="2"
                >

            </div>


            <!-- ==================================================
                 曜日・時限
            ================================================== -->

            <div class="form-group">

                <div class="form-label-row">

                    <label>
                        曜日・時限
                    </label>


                    <span>
                        選択：
                        <strong
                            id="selectedSlotCount"
                        >
                            0
                        </strong>
                        コマ
                    </span>

                </div>


                <div
                    id="slotGrid"
                    class="slot-grid"
                >

                </div>

            </div>


            <!-- ==================================================
                 色
            ================================================== -->

            <div class="form-group">

                <label>
                    色
                </label>


                <div class="color-options">

                    <button
                        type="button"
                        class="color-option color-1 selected"
                        data-color="1"
                        aria-label="色1"
                    ></button>


                    <button
                        type="button"
                        class="color-option color-2"
                        data-color="2"
                        aria-label="色2"
                    ></button>


                    <button
                        type="button"
                        class="color-option color-3"
                        data-color="3"
                        aria-label="色3"
                    ></button>


                    <button
                        type="button"
                        class="color-option color-4"
                        data-color="4"
                        aria-label="色4"
                    ></button>


                    <button
                        type="button"
                        class="color-option color-5"
                        data-color="5"
                        aria-label="色5"
                    ></button>


                    <button
                        type="button"
                        class="color-option color-6"
                        data-color="6"
                        aria-label="色6"
                    ></button>

                </div>

            </div>


            <!-- ==================================================
                 ボタン
            ================================================== -->

            <div class="modal-actions">

                <button
                    id="deleteClassButton"
                    class="danger-button"
                    type="button"
                    style="display:none;"
                >
                    授業を削除
                </button>


                <div class="modal-actions-right">

                    <button
                        id="cancelClassButton"
                        type="button"
                    >
                        キャンセル
                    </button>


                    <button
                        id="saveClassButton"
                        class="primary-button"
                        type="button"
                    >
                        保存
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ==================================================
         カレンダー予定モーダル
    ================================================== -->

    <div
        id="eventModal"
        class="modal"
    >

        <div class="modal-content">


            <!-- ヘッダー -->

            <div class="modal-header">

                <h2
                    id="eventModalTitle"
                >
                    予定を追加
                </h2>


                <button
                    id="closeEventModalButton"
                    class="close-button"
                    type="button"
                    aria-label="閉じる"
                >
                    ×
                </button>

            </div>


            <!-- ==================================================
                 日付
            ================================================== -->

            <div class="form-group">

                <label
                    for="eventDate"
                >
                    日付
                </label>


                <input
                    id="eventDate"
                    type="date"
                >

            </div>


            <!-- ==================================================
                 予定名
            ================================================== -->

            <div class="form-group">

                <label
                    for="eventTitle"
                >
                    予定
                </label>


                <input
                    id="eventTitle"
                    type="text"
                    placeholder="例：試験"
                    autocomplete="off"
                >

            </div>


            <!-- ==================================================
                 開始時刻
            ================================================== -->

            <div class="form-group">

                <label
                    for="eventStartTime"
                >
                    開始
                </label>


                <input
                    id="eventStartTime"
                    type="time"
                >

            </div>


            <!-- ==================================================
                 終了時刻
            ================================================== -->

            <div class="form-group">

                <label
                    for="eventEndTime"
                >
                    終了
                </label>


                <input
                    id="eventEndTime"
                    type="time"
                >

            </div>


            <!-- ==================================================
                 メモ
            ================================================== -->

            <div class="form-group">

                <label
                    for="eventMemo"
                >
                    メモ
                </label>


                <textarea
                    id="eventMemo"
                    rows="4"
                    placeholder="メモを入力"
                ></textarea>

            </div>


            <!-- ==================================================
                 ボタン
            ================================================== -->

            <div class="modal-actions">

                <button
                    id="deleteEventButton"
                    class="danger-button"
                    type="button"
                    style="display:none;"
                >
                    予定を削除
                </button>


                <div class="modal-actions-right">

                    <button
                        id="cancelEventButton"
                        type="button"
                    >
                        キャンセル
                    </button>


                    <button
                        id="saveEventButton"
                        class="primary-button"
                        type="button"
                    >
                        保存
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ==================================================
         JavaScript
         
         読み込み順が重要
    ================================================== -->

    <script src="js/storage.js"></script>

    <script src="js/timetable.js"></script>

    <script src="js/calendar.js"></script>

    <script src="js/modal.js"></script>

    <script src="js/app.js"></script>


</body>

</html>
